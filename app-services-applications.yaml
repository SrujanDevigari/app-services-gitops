apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-services-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/srujan6868/app-services-gitops.git
    targetRevision: main
    path: k8s/overlays/dev # this is for Dev
  destination:
    server: https://kubernetes.default.svc
    namespace: app-dev
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
---
